<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Glosario</title>
  </head>

  <body>
    <input
      id="filterInput"
      type="text"
      placeholder="Filtrar..."
      style="padding: 8px; margin-bottom: 10px; width: 300px; font-size: 14px"
      oninput="filtrar(this.value)"
    />

    <table
      id="jsonTable"
      border="1"
      cellpadding="5"
      style="border-collapse: collapse; width: 100%"
    ></table>

    <script>
      window.boot.register("page-ready", () => {
        let jsonData = [];
        let jsonDataCopy = [];

        const table = document.getElementById("jsonTable");

        function render(rows) {
          const thead = `
        <tr>
          <th>ID</th>
          <th>Término</th>
          <th>Definición</th>
        </tr>
      `;
          const tbody = rows
            .map(
              (row) => `
        <tr>
          <td>${row.id}</td>
          <td>${row.term}</td>
          <td>${row.definition}</td>
        </tr>
      `,
            )
            .join("");

          table.innerHTML = `<thead>${thead}</thead><tbody>${tbody}</tbody>`;
        }

        window.filtrar = (value) => {
          const v = value.toLowerCase();
          render(
            !v
              ? jsonDataCopy
              : jsonData.filter((obj) =>
                  JSON.stringify(obj).toLowerCase().includes(v),
                ),
          );
        };

        fetch("/json/glosario.json")
          .then((r) => r.json())
          .then((data) => {
            jsonData = data;
            jsonDataCopy = data;
            render(data);
          });
      });
    </script>
  </body>
</html>
