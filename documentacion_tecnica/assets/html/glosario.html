<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Glosario</title>
</head>

<body>

<input
  id="filterInput"
  type="text"
  placeholder="Filtrar..."
  style="padding:8px;margin-bottom:10px;width:300px;font-size:14px;"
/>

<table id="jsonTable" border="1" cellpadding="5" style="border-collapse: collapse; width:100%;"></table>

<script>

  console.log("Cargando glosario...");
document.addEventListener("DOMContentLoaded", () => {

  const table = document.getElementById("jsonTable");
  if (!table) return;

  fetch("../assets/json/glosario.json")
    .then(r => r.json())
    .then(data => {

      function render(rows) {

        const thead = `
          <tr>
            <th>ID</th>
            <th>Término</th>
            <th>Definición</th>
          </tr>
        `;

        const tbody = rows.map(row => `
          <tr>
            <td>${row.id}</td>
            <td>${row.term}</td>
            <td>${row.definition}</td>
          </tr>
        `).join("");

        table.innerHTML = `
          <thead>${thead}</thead>
          <tbody>${tbody}</tbody>
        `;
      }

      render(data);

      const input = document.getElementById("filterInput");

      if (input) {
        input.addEventListener("input", () => {

          const v = input.value.toLowerCase();

          render(
            data.filter(obj =>
              JSON.stringify(obj).toLowerCase().includes(v)
            )
          );

        });
      }

    });

});
</script>

</body>
</html>
