<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wiki Proyecto IDEAM SNIF</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Description" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    />
  </head>
  <body>

    <style>
      .zoomable-container {
        position: relative;
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        border-radius: 8px;
      }

      .zoomable {
        display: block;
        width: 100%;
        height: auto;
        cursor: grab;
        user-select: none;
      }

      /* 🔹 Controles dentro de la imagen */
      .zoom-controls {
        position: absolute;
        bottom: 12px;
        right: 12px;
        display: flex;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 8px;
        padding: 4px;
        z-index: 5;
        backdrop-filter: blur(4px);
      }

      .zoom-controls button {
        background: transparent;
        color: #fff;
        border: none;
        font-size: 18px;
        margin: 0 3px;
        cursor: pointer;
        transition: transform 0.2s, color 0.2s;
      }

      .zoom-controls button:hover {
        transform: scale(1.2);
        color: #00bcd4;
      }

      .app-nav {
        margin: 0 !important;
      }

      .navbar {
        max-width: 800px;
        width: auto;
      }

      /* Contenedor de login */
      #auth-container {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 9999;
      }

      #auth-container h2 {
        margin-bottom: 20px;
        color: #333;
      }

      #app {
        display: none;
      }
    </style>

    <!-- Contenedor de login -->
    <div id="auth-container" style="text-align:center;">
      <h2>Inicia sesión para acceder</h2>
    </div>

    <div id="app"></div>
    <!-- Docsify v4 -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/docsify-include.js"></script>
    <script src="https://unpkg.com/@panzoom/panzoom/dist/panzoom.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>

  // Tu Client ID de Google Cloud
  const SHEET_URL  = "https://script.google.com/macros/s/AKfycbwLNRKVXFr3Rce9vnY8GW6R4v3l7yer9vtUahdVc9Li5dGP6Yl-qOaV49Wv4Tx38rCp/exec";
  const CLIENT_ID = "444181898034-bj3ijh735krh74pajl733mtkp1lvisns.apps.googleusercontent.com";

  async function getAllowedEmails() {
        try {
          const res = await fetch(SHEET_URL);
          const data = await res.json();
          cosole.log(data)
          return data.emails || [];
        } catch (e) {
          console.error("Error obteniendo correos permitidos:", e);
          return [];
        }
      }

  // Función que se ejecuta al iniciar sesión correctamente
  async function handleCredentialResponse(response) {
    const data = parseJwt(response.credential);
    const email = data.email;

    const allowed = await getAllowedEmails();
    return

    if (allowed.includes(email)) {
      // Autorizado ✅
      document.getElementById("auth-container").style.display = "none";
      document.getElementById("app").style.display = "block";
    } else {
      document.body.innerHTML = `<h2 style="text-align:center;margin-top:20%">⛔ Acceso denegado: ${email}</h2>`;
    }
  }

  // Función para decodificar el token JWT
  function parseJwt(token) {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(
      atob(base64)
        .split('')
        .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
        .join('')
    );
    return JSON.parse(jsonPayload);
  }

  function doGet() {
    const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName("Permisos");
    const data = sheet.getRange(2, 1, sheet.getLastRow() - 1, 1).getValues();
    const emails = data.flat().filter(String); // elimina celdas vacías
    return ContentService
      .createTextOutput(JSON.stringify({ emails }))
      .setMimeType(ContentService.MimeType.JSON);
  }

  window.onload = function() {

    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: handleCredentialResponse
    });
    google.accounts.id.renderButton(
      document.getElementById("auth-container"),
      { theme: "outline", size: "large" }
    );
  };
</script>

    <script>
      const isLocal =
        location.hostname === "localhost" || location.hostname === "127.0.0.1";

      window.$docsify = {
        name: "",
        repo: "",
        basePath: isLocal ? "/" : "/wiki/",
        auto2top: true,
        autoHeader: true,
        coverpage: true,
        onlyCover: true,
        notFoundPage: true,
        themeColor: "#00b27c",
        loadSidebar: false,
        loadNavbar: true,
        subMaxLevel: 2,
        plugins: [
          function (hook, vm) {
            hook.beforeEach(function (content, next) {
              if (/^\/content\/historias_usuario\/[^/]+/.test(vm.route.path)) {
                fetch("includes/historia_header.md")
                  .then((r) => r.text())
                  .then((header) => {
                    next(header + "\n\n" + content);
                  });
              } else {
                next(content);
              }
            });
          },
          function (hook, vm) {
            hook.afterEach(function (html, next) {
              let currentDir = "";
              if (vm.route.file && vm.route.file.includes("/")) {
                currentDir = vm.route.file.replace(/[^/]+$/, "");
              }

              const isGitHubPages = location.hostname.endsWith("github.io");
              const repoBase = isGitHubPages
                ? location.pathname.split("/")[1] + "/"
                : "";

              const fixedHtml = html.replace(
                /<img\s+([^>]*?)src=["']assets\/(.*?)["']/g,
                `<img $1src="/${repoBase}${currentDir}assets/$2"`
              );

              next(fixedHtml);
            });

            hook.doneEach(() => {
              document.querySelectorAll(".zoomable").forEach((img) => {
                if (img.parentElement.classList.contains("zoomable-container"))
                  return;

                const wrapper = document.createElement("div");
                wrapper.className = "zoomable-container";
                img.parentNode.insertBefore(wrapper, img);
                wrapper.appendChild(img);

                const controls = document.createElement("div");
                controls.className = "zoom-controls";
                controls.innerHTML = `
                  <button title="Acercar">＋</button>
                  <button title="Alejar">－</button>
                  <button title="Restablecer">⟳</button>
                `;
                wrapper.appendChild(controls);

                const panzoom = Panzoom(img, {
                  maxScale: 5,
                  contain: "outside",
                });

                const [btnIn, btnOut, btnReset] =
                  controls.querySelectorAll("button");
                btnIn.onclick = () => panzoom.zoomIn();
                btnOut.onclick = () => panzoom.zoomOut();
                btnReset.onclick = () => panzoom.reset();
              });
            });
          },
          ,
        ],
      };
    </script>
  </body>
</html>
