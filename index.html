<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Description" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <!-- Docsify v4 -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/docsify-include.js"></script>
    <script src="https://unpkg.com/@panzoom/panzoom/dist/panzoom.min.js"></script>

    <style>
      .zoomable-container {
        position: relative;
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        border-radius: 8px;
      }

      .zoomable {
        display: block;
        width: 100%;
        height: auto;
        cursor: grab;
        user-select: none;
      }

      /* 🔹 Controles dentro de la imagen */
      .zoom-controls {
        position: absolute;
        bottom: 12px;
        right: 12px;
        display: flex;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 8px;
        padding: 4px;
        z-index: 5;
        backdrop-filter: blur(4px);
      }

      .zoom-controls button {
        background: transparent;
        color: #fff;
        border: none;
        font-size: 18px;
        margin: 0 3px;
        cursor: pointer;
        transition: transform 0.2s, color 0.2s;
      }

      .zoom-controls button:hover {
        transform: scale(1.2);
        color: #00bcd4;
      }
    </style>

    <script>
      window.$docsify = {
        name: "",
        repo: "",
        auto2top: true,
        autoHeader: true,
        coverpage: true,
        onlyCover: true,
        notFoundPage: true,
        themeColor: "#00b27c",
        loadSidebar: false,
        subMaxLevel: 2,
        plugins: [
          function (hook, vm) {
            hook.beforeEach(function (content, next) {
              if (/^\/content\/historias_usuario\/[^/]+/.test(vm.route.path)) {
                fetch("includes/historia_header.md")
                  .then((r) => r.text())
                  .then((header) => {
                    next(header + "\n\n" + content);
                  });
              } else {
                next(content);
              }
            });
          },
          function (hook, vm) {
            hook.afterEach(function (html, next) {
              let currentDir = "";
              if (vm.route.file && vm.route.file.includes("/")) {
                currentDir = vm.route.file.replace(/[^/]+$/, "");
              }
              const fixedHtml = html.replace(
                /<img\s+([^>]*?)src=["']assets\/(.*?)["']/g,
                `<img $1src="/${currentDir}assets/$2"`
              );
              next(fixedHtml);
            });

            hook.doneEach(() => {
              document.querySelectorAll(".zoomable").forEach((img) => {
                // Evitar reenvolver si ya se hizo
                if (img.parentElement.classList.contains("zoomable-container"))
                  return;

                // Crear contenedor alrededor de la imagen
                const wrapper = document.createElement("div");
                wrapper.className = "zoomable-container";
                img.parentNode.insertBefore(wrapper, img);
                wrapper.appendChild(img);

                // Crear controles DENTRO del contenedor
                const controls = document.createElement("div");
                controls.className = "zoom-controls";
                controls.innerHTML = `
              <button title="Acercar">＋</button>
              <button title="Alejar">－</button>
              <button title="Restablecer">⟳</button>
            `;
                wrapper.appendChild(controls);

                // Inicializar Panzoom
                const panzoom = Panzoom(img, {
                  maxScale: 5,
                  contain: "outside",
                });

                // Asignar funciones a los botones
                const [btnIn, btnOut, btnReset] =
                  controls.querySelectorAll("button");
                btnIn.onclick = () => panzoom.zoomIn();
                btnOut.onclick = () => panzoom.zoomOut();
                btnReset.onclick = () => panzoom.reset();
              });
            });
          },
        ],
      };
    </script>
  </body>
</html>
